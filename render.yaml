# Render Blueprint for OilMitra.
# One web service serves the API and both browser apps:
#   /app/   supplier app
#   /admin/ operator console
services:
  - type: web
    name: oilmitra
    runtime: python
    plan: free
    region: singapore          # closest free region to India
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TZ
        value: Asia/Kolkata
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL     # paste the Neon connection string when Render asks
        sync: false
      - key: JWT_SECRET       # Render generates a random login-token secret
        generateValue: true
      - key: JWT_EXPIRE_DAYS
        value: "30"
      - key: ADMIN_USERNAMES  # comma-separated operator usernames
        sync: false
      - key: GOOGLE_MAPS_API_KEY  # Google Maps (web JS + native SDK) and Geocoding
        sync: false
      - key: DONATE_NAME
        value: OilMitra
      - key: DONATE_UPI_ID    # optional support pop-up; leave empty to hide
        sync: false
      - key: DONATE_URL
        sync: false
      - key: CO2_PER_LITER
        value: "2.8"
      - key: BIODIESEL_YIELD
        value: "0.92"
